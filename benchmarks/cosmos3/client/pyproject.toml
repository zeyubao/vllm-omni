[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-omni-cosmos3-client"
version = "0.1.0"
description = "Standalone Cosmos3 HTTP and LIBERO client plugin for vLLM-Omni"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "Apache-2.0 AND OpenMDW-1.1; see LICENSE-APACHE, LICENSE and source notices"}
dependencies = [
    "llvmlite==0.44.0",
    "numba==0.61.2",
    "numpy>=1.24,<2",
    "scipy>=1.10,<1.16",
    "pillow>=10",
    "requests>=2.28",
    "torch>=2.5,<3",
    "robosuite==1.4.1",
    "mujoco==2.3.7",
    "robomimic==0.2.0",
    "bddl==1.0.1",
    "gym==0.25.2",
    "cloudpickle>=2.1",
    "easydict>=1.9",
    "opencv-python>=4.6,<4.12",
    "imageio[ffmpeg]>=2.31",
    "pyyaml>=6",
]

[project.scripts]
vllm-omni-cosmos3-client = "vllm_omni_cosmos3_client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_omni_cosmos3_client*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
markers = ["cpu: CPU-only client runtime regression"]
